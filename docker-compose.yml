version: "3.9"

services:
  # ── Frontend (React + Nginx) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: botpilot-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Backend (FastAPI + Uvicorn) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: botpilot-backend
    ports:
      - "8000:8000"
    environment:
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

volumes:
  backend-data:
